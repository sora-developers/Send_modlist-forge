buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        classpath files("${projectDir}/retrofuturagradle-1.3.27.jar")
    }
}

apply plugin: "com.gtnewhorizons.retrofuturagradle"

group = "com.rakku212"
version = "1.0"
archivesBaseName = "send_modlist"

minecraft {
    mcVersion = "1.12.2"
    mcpMappingChannel = "snapshot"
    mcpMappingVersion = "20171003"
}

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = "UTF-8"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version,
                "mcversion": "1.12.2",
                "modid": "send_modlist",
                "modname": "Send_modlist",
                "modauthors": "neko developer",
                "moddescription": ""
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
